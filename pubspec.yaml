name: delivery_agent_app
description: Delivery agent mobile app for canteen order system
publish_to: "none"
version: 1.0.0+1

environment:
  # [CHANGE] Dart SDK lower bound raised to >=3.8.0 to match Flutter 3.32+/3.44 stable.
  # Flutter 3.44 (May 2026) ships Dart 3.8. The old >=3.3.0 bound is stale.
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.3.1

  go_router: ^16.2.0

  dio: ^5.9.2
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1

  socket_io_client: ^2.0.3+1

  geolocator: ^14.0.2

  permission_handler: ^12.0.1

  flutter_background_service: ^5.0.5
  flutter_background_service_android: ^6.2.2

  flutter_secure_storage: ^10.0.0

  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  intl: ^0.19.0

  freezed_annotation: ^3.1.0
  json_annotation: 4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  build_runner: ^2.6.0

  freezed: ^3.1.0
  
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
